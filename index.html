<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Thailand Travel Atlas</title>

  <style>
    body {
      margin: 0;
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      background: #f7f7f3;
      color: #222;
    }

    .wrap {
      padding: 14px;
    }

    h1 {
      font-size: 20px;
      margin: 0 0 8px;
    }

    .legend {
      display: flex;
      gap: 14px;
      font-size: 13px;
      margin-bottom: 10px;
      flex-wrap: wrap;
      align-items: center;
    }

    .dot {
      width: 12px;
      height: 12px;
      border-radius: 50%;
      display: inline-block;
      margin-right: 5px;
      vertical-align: -1px;
    }

    .visited { background: #4CAF50; }
    .planned { background: #F4C542; }
    .unvisited { background: #E8E8E8; border: 1px solid #aaa; }

    #chartdiv {
      width: 100%;
      height: 680px;
      border-radius: 16px;
      border: 1px solid #ddd;
      background: #ffffff;
      overflow: hidden;
    }

    .info {
      margin-top: 10px;
      font-size: 13px;
      color: #555;
    }
  </style>
</head>

<body>
  <div class="wrap">
    <h1>🇹🇭 Thailand Travel Atlas</h1>

    <div class="legend">
      <span><span class="dot visited"></span>訪問済み</span>
      <span><span class="dot planned"></span>計画中</span>
      <span><span class="dot unvisited"></span>未訪問</span>
    </div>

    <div id="chartdiv"></div>

    <div class="info">
      テスト版：まず地図表示と色分けを確認
    </div>
  </div>

  <script src="https://cdn.amcharts.com/lib/5/index.js"></script>
  <script src="https://cdn.amcharts.com/lib/5/map.js"></script>
  <script src="https://cdn.amcharts.com/lib/5/geodata/thailandLow.js"></script>
  <script src="https://cdn.amcharts.com/lib/5/themes/Animated.js"></script>

  <script>
    am5.ready(function() {
      const root = am5.Root.new("chartdiv");

      root.setThemes([
        am5themes_Animated.new(root)
      ]);

      const chart = root.container.children.push(
        am5map.MapChart.new(root, {
          panX: "none",
          panY: "none",
          wheelY: "none",
          projection: am5map.geoMercator()
        })
      );

      // 訪問済み県
      const visited = [
        "TH-10", // Bangkok
        "TH-20", // Chon Buri
        "TH-21", // Rayong
        "TH-22", // Chanthaburi
        "TH-23", // Trat
        "TH-30", // Nakhon Ratchasima
        "TH-34", // Ubon Ratchathani
        "TH-40", // Khon Kaen
        "TH-41", // Udon Thani
        "TH-43", // Nong Khai
        "TH-48", // Nakhon Phanom
        "TH-50", // Chiang Mai
        "TH-57", // Chiang Rai
        "TH-71", // Kanchanaburi
        "TH-90"  // Songkhla
      ];

      // 計画中県
      const planned = [
        "TH-92", // Trang
        "TH-93", // Phatthalung
        "TH-94", // Pattani
        "TH-95", // Yala
        "TH-96"  // Narathiwat
      ];

      const polygonSeries = chart.series.push(
        am5map.MapPolygonSeries.new(root, {
          geoJSON: am5geodata_thailandLow
        })
      );

      polygonSeries.mapPolygons.template.setAll({
        tooltipText: "{name}",
        interactive: true,
        stroke: am5.color(0xffffff),
        strokeWidth: 1,
        fill: am5.color(0xe8e8e8)
      });

      polygonSeries.mapPolygons.template.adapters.add("fill", function(fill, target) {
        const id = target.dataItem.dataContext.id;

        if (visited.includes(id)) {
          return am5.color(0x4CAF50);
        }

        if (planned.includes(id)) {
          return am5.color(0xF4C542);
        }

        return am5.color(0xE8E8E8);
      });

      polygonSeries.mapPolygons.template.states.create("hover", {
        fill: am5.color(0x7BC67E)
      });

      polygonSeries.events.on("datavalidated", function() {
        chart.goHome();
      });
    });
  </script>
</body>
</html>
