name: Update Notion Status

on:
  workflow_dispatch:
  schedule:
    - cron: "0 * * * *"

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest

    env:
      NOTION_TOKEN: ${{ secrets.NOTION_TOKEN }}
      NOTION_DATABASE_ID: ${{ secrets.NOTION_DATABASE_ID }}
      NOTION_TRIP_DATA_SOURCE_ID: ${{ secrets.NOTION_TRIP_DATA_SOURCE_ID }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Check secrets
        run: |
          node -e "console.log('NOTION_TOKEN exists:', !!process.env.NOTION_TOKEN)"
          node -e "console.log('NOTION_DATABASE_ID exists:', !!process.env.NOTION_DATABASE_ID)"

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Update status from Notion
        run: node scripts/update-status.js

      - name: Commit status.json
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/status.json
          if git diff --cached --quiet; then
            echo "No changes"
          else
            git commit -m "Update Notion status"
            git push
          fi
